<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Zombie Shooter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    #gameCanvas {
      background: #333;
      border: 2px solid #fff;
      display: block;
      margin: 20px auto;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      cursor: pointer;
    }
    #hud {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <!-- Tela de Login -->
  <div id="login-screen">
    <h1>Zombie Shooter</h1>
    <input type="text" id="username" placeholder="Digite seu nome">
    <button onclick="login()">Entrar</button>
  </div>

  <!-- Tela do Jogo -->
  <div id="game-screen" style="display:none;">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="hud">
      <p>Fase: <span id="fase">1</span>/12</p>
      <p>Desafio: <span id="desafio">1</span>/10</p>
      <p>Pontos: <span id="pontos">0</span></p>
    </div>
    <p>Use a tecla <b>ESPAÇO</b> para atirar!</p>
  </div>

  <!-- Tela de Ranking -->
  <div id="ranking-screen" style="display:none;">
    <h2>Ranking</h2>
    <ul id="ranking-list"></ul>
    <button onclick="restart()">Jogar novamente</button>
  </div>

  <script>
    let player = { name: "", pontos: 0, fase: 1, desafio: 1 };
    let ranking = [];

    function login() {
      const username = document.getElementById("username").value;
      if (username.trim() === "") return alert("Digite um nome!");
      player.name = username;
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("game-screen").style.display = "block";
      startGame();
    }

    function startGame() {
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      document.addEventListener("keydown", shoot);

      function shoot(e) {
        if (e.code === "Space") {
          // Pontuação básica
          player.pontos += 10;

          // Chefão na última fase
          if (player.fase === 12 && player.desafio === 10) {
            player.pontos += 100; // bônus do chefão derrotado
            endGame();
          } else {
            nextChallenge();
          }
          updateHUD();
        }
      }

      function updateHUD() {
        document.getElementById("fase").textContent = player.fase;
        document.getElementById("desafio").textContent = player.desafio;
        document.getElementById("pontos").textContent = player.pontos;
      }

      function nextChallenge() {
        if (player.desafio < 10) {
          player.desafio++;
        } else {
          player.desafio = 1;
          player.fase++;
        }

        if (player.fase > 12) {
          endGame();
        }
      }

      function endGame() {
        document.getElementById("game-screen").style.display = "none";
        document.getElementById("ranking-screen").style.display = "block";

        ranking.push({ name: player.name, pontos: player.pontos });
        ranking.sort((a, b) => b.pontos - a.pontos);

        const list = document.getElementById("ranking-list");
        list.innerHTML = "";
        ranking.forEach(r => {
          const li = document.createElement("li");
          li.textContent = `${r.name} - ${r.pontos} pontos`;
          list.appendChild(li);
        });
      }
    }

    function restart() {
      player = { name: player.name, pontos: 0, fase: 1, desafio: 1 };
      document.getElementById("ranking-screen").style.display = "none";
      document.getElementById("game-screen").style.display = "block";
      startGame();
    }
  </script>
</body>
</html>
