<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnata Sim - Simulador de Negócios</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --green: #10b981;
            --red: #ef4444;
            --accent: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            width: 90%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        header {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: var(--accent);
        }

        .balance-box {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--green);
            margin: 15px 0;
            transition: transform 0.2s;
        }

        .balance-box.negative {
            color: var(--red);
        }

        .proposal-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .proposal-text {
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .proposal-impact {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        button {
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-accept {
            background-color: var(--green);
            color: white;
        }

        .btn-accept:hover {
            background-color: #059669;
            transform: scale(1.05);
        }

        .btn-decline {
            background-color: var(--red);
            color: white;
        }

        .btn-decline:hover {
            background-color: #dc2626;
            transform: scale(1.05);
        }

        .stats {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <header>
            <h1>Império dos Negócios</h1>
            <p>Tome as decisões certas para buildar sua fortuna.</p>
            <div class="balance-box" id="balance">R$ 0</div>
        </header>

        <div class="proposal-card">
            <p class="proposal-text" id="proposal-desc">Carregando primeira proposta...</p>
            <p class="proposal-impact" id="proposal-detail"></p>
        </div>

        <div class="btn-container">
            <button class="btn-decline" onclick="decide(false)">Recusar</button>
            <button class="btn-accept" onclick="clickAceitar()">Aceitar</button>
        </div>

        <div class="stats">
            Decisões tomadas: <span id="turn-count">0</span>
        </div>
    </div>

    <script>
        // Banco de dados de propostas (Riscos e Oportunidades)
        const proposals = [
            { desc: "Vender limonada na frente de casa.", ganho: 50, perda: 0, chanceSucesso: 100, detalhe: "Ganho garantido de R$ 50" },
            { desc: "Investir em uma nova criptomoeda meme.", ganho: 5000, perda: 1000, chanceSucesso: 30, detalhe: "30% de chance de lucrar R$ 5.000, senão perde R$ 1.000" },
            { desc: "Comprar um lote de produtos eletrônicos importados.", ganho: 1200, perda: 400, chanceSucesso: 70, detalhe: "70% de chance de revender com lucro" },
            { desc: "Criar um aplicativo de entrega para o seu bairro.", ganho: 3000, perda: 800, chanceSucesso: 55, detalhe: "Risco moderado de mercado" },
            { desc: "Pegar um trabalho como freelancer de última hora.", ganho: 350, perda: 0, chanceSucesso: 100, detalhe: "Dinheiro garantido pelo seu tempo" },
            { desc: "Abrir uma franquia de cafeteria de grife.", ganho: 15000, perda: 8000, chanceSucesso: 45, detalhe: "Alto investimento, alto retorno" },
            { desc: "Apostar no cavalo azarão no hipódromo.", ganho: 8000, perda: 2000, chanceSucesso: 15, detalhe: "Risco altíssimo!" },
            { desc: "Comprar ações de uma empresa de tecnologia sólida.", ganho: 1500, perda: 300, chanceSucesso: 80, detalhe: "Investimento seguro" },
            { desc: "Patrocinar um influenciador digital local.", ganho: 2500, perda: 1200, chanceSucesso: 60, detalhe: "Pode trazer muitos clientes" },
            { desc: "Comprar uma máquina de estampar camisetas usada.", ganho: 900, perda: 200, chanceSucesso: 75, detalhe: "Bom potencial de micro-negócio" }
        ];

        let balance = 0;
        let turn = 0;
        let currentProposal = {};

        const balanceEl = document.getElementById('balance');
        const descEl = document.getElementById('proposal-desc');
        const detailEl = document.getElementById('proposal-detail');
        const turnEl = document.getElementById('turn-count');

        function nextProposal() {
            // Seleciona uma proposta aleatória do array
            const randomIndex = Math.floor(Math.random() * proposals.length);
            currentProposal = proposals[randomIndex];
            
            // Atualiza a tela
            descEl.innerText = currentProposal.desc;
            detailEl.innerText = currentProposal.detalhe;
        }

        function clickAceitar() {
            decide(true);
        }

        function decide(accepted) {
            if (accepted) {
                // Calcula se a proposta deu certo baseado na chance de sucesso
                const success = (Math.random() * 100) <= currentProposal.chanceSucesso;
                
                if (success) {
                    balance += currentProposal.ganho;
                    animateBalance('var(--green)');
                } else {
                    balance -= currentProposal.perda;
                    animateBalance('var(--red)');
                }
            }

            // Atualiza os dados na tela
            turn++;
            turnEl.innerText = turn;
            updateBalanceDisplay();
            
            // Avança para a próxima
            nextProposal();
        }

        function updateBalanceDisplay() {
            balanceEl.innerText = `R$ ${balance.toLocaleString('pt-BR')}`;
            if (balance < 0) {
                balanceEl.classList.add('negative');
            } else {
                balanceEl.classList.remove('negative');
            }
        }

        function animateBalance(color) {
            balanceEl.style.transform = 'scale(1.1)';
            setTimeout(() => {
                balanceEl.style.transform = 'scale(1)';
            }, 200);
        }

        // Inicializa o jogo
        nextProposal();
    </script>
</body>
</html>
