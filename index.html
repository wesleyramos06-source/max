<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnata Sim - Simulador de Negócios</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --green: #10b981;
            --red: #ef4444;
            --accent: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        /* Classes de utilidade para alternar telas */
        .hidden {
            display: none !important;
        }

        header {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: var(--accent);
        }

        /* Estilos da Tela de Login */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .login-form input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        .login-form input:focus {
            border-color: var(--accent);
        }

        /* Estilos do Jogo */
        .balance-box {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--green);
            margin: 15px 0;
            transition: transform 0.2s;
        }

        .balance-box.negative {
            color: var(--red);
        }

        .proposal-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .proposal-text {
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .proposal-impact {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        button {
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-block {
            width: 100%;
        }

        .btn-accent {
            background-color: var(--accent);
            color: white;
        }

        .btn-accent:hover {
            background-color: #2563eb;
            transform: scale(1.02);
        }

        .btn-accept {
            background-color: var(--green);
            color: white;
            width: 100%;
        }

        .btn-accept:hover {
            background-color: #059669;
            transform: scale(1.05);
        }

        .btn-decline {
            background-color: var(--red);
            color: white;
            width: 100%;
        }

        .btn-decline:hover {
            background-color: #dc2626;
            transform: scale(1.05);
        }

        .stats {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container" id="login-screen">
        <header>
            <h1>Acessar Sistema</h1>
            <p>Insira suas credenciais corporativas para começar</p>
        </header>
        <div class="login-form">
            <input type="text" id="username" placeholder="Nome do Empresário(a)" required>
            <button class="btn-accent btn-block" onclick="efetuarLogin()">Entrar no Painel</button>
        </div>
    </div>

    <div class="container hidden" id="game-screen">
        <header>
            <h1 id="welcome-msg">Império dos Negócios</h1>
            <p>Tome as decisões certas para buildar sua fortuna.</p>
            <div class="balance-box" id="balance">R$ 0</div>
        </header>

        <div class="proposal-card">
            <p class="proposal-text" id="proposal-desc">Carregando primeira proposta...</p>
            <p class="proposal-impact" id="proposal-detail"></p>
        </div>

        <div class="btn-container">
            <button class="btn-decline" onclick="decide(false)">Recusar</button>
            <button class="btn-accept" onclick="decide(true)">Aceitar</button>
        </div>

        <div class="stats">
            Decisões tomadas: <span id="turn-count">0</span>
        </div>
    </div>
