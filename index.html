<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Survival - J.A.R.V.I.S. OS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #050b14;
            color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Interface Estilo JARVIS */
        #hud {
            width: 800px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #00f0ff;
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .hud-item {
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
        }

        #jarvis-console {
            width: 800px;
            height: 50px;
            border: 1px solid #ff0055;
            background: rgba(255, 0, 85, 0.05);
            margin-bottom: 10px;
            padding: 5px 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.1);
            color: #ff3377;
        }

        /* Tela do Jogo */
        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #0a0a14;
            border: 2px solid #00f0ff;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
        }

        #player {
            position: absolute;
            bottom: 20px;
            left: 385px;
            width: 30px;
            height: 40px;
            background: #00f0ff;
            border-radius: 3px;
            box-shadow: 0 0 15px #00f0ff;
            transition: left 0.05s linear;
        }

        /* Elementos Dinâmicos */
        .bullet {
            position: absolute;
            width: 4px;
            height: 15px;
            background: #ffff00;
            box-shadow: 0 0 8px #ffff00;
        }

        .zombie {
            position: absolute;
            width: 30px;
            height: 35px;
            background: #00ff55;
            border-radius: 3px;
            box-shadow: 0 0 10px #00ff55;
        }

        /* Telas de Menu / Login / Game Over */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 11, 20, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00f0ff;
            text-align: center;
        }

        /* Input de Login */
        .login-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid #00f0ff;
            padding: 10px 15px;
            font-family: inherit;
            font-size: 16px;
            color: #00f0ff;
            text-align: center;
            outline: none;
            width: 250px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            border-color: #ffffff;
        }

        button {
            background: transparent;
            color: #00f0ff;
            border: 2px solid #00f0ff;
            padding: 12px 30px;
            font-size: 18px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            transition: 0.3s;
        }

        button:hover {
            background: #00f0ff;
            color: #050b14;
            box-shadow: 0 0 25px #00f0ff;
        }

        .hide {
            display: none !important;
        }
    </style>
</head>

        <div class="hud-item">ETAPA: <span id="ui-stage">1</span>/3</div>

            <button onclick="restartGame()" style="color: #ff0055; border-color: #ff0055;">REINICIAR PROTOCOLO</button>
        </div>
    </div>
