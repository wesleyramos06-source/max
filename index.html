<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Desafio de Tiro ao Alvo CSS</title>
    <style>
        body {
            margin: 0;
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            cursor: crosshair;
        }

        /* Container do Jogo */
        .game-world {
            position: relative;
            width: 600px;
            height: 400px;
            background: #333;
            border: 4px solid #555;
            border-radius: 10px;
            overflow: hidden;
        }

        /* Contador de Pontos */
        .score-counter::before {
            content: "Alvos restantes: ";
            font-size: 20px;
            margin-bottom: 10px;
        }

        /* Lógica dos Alvos */
        input[type="radio"] {
            display: none;
        }

        .target {
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, red 20%, white 21%, white 40%, red 41%, red 60%, white 61%);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
            animation: float 4s infinite alternate ease-in-out;
        }

        /* Esconder o alvo quando clicado */
        input[type="radio"]:checked + .target {
            display: none;
        }

        /* Animação de movimento dos alvos */
        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(500px, 300px); }
        }

        /* Posições variadas para os alvos */
        #t1 + .target { top: 10%; left: 5%; animation-duration: 3s; }
        #t2 + .target { top: 40%; left: 80%; animation-duration: 5s; animation-delay: -1s; }
        #t3 + .target { top: 70%; left: 20%; animation-duration: 4s; animation-delay: -2s; }
        #t4 + .target { top: 20%; left: 50%; animation-duration: 6s; }

        /* Mensagem de Vitória */
        .win-message {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        /* Se todos os 4 alvos forem clicados, mostra vitória */
        #t1:checked ~ #t2:checked ~ #t3:checked ~ #t4:checked ~ .win-message {
            display: block;
        }
    </style>
</head>
<body>

    <div class="score-counter"></div>

    <div class="game-world">
        <input type="radio" id="t1">
        <label for="t1" class="target"></label>

        <input type="radio" id="t2">
        <label for="t2" class="target"></label>

        <input type="radio" id="t3">
        <label for="t3" class="target"></label>

        <input type="radio" id="t4">
        <label for="t4" class="target"></label>

        <div class="win-message">
            <h1>🎯 VITÓRIA!</h1>
            <p>Você acertou todos os alvos!</p>
            <button onclick="location.reload()">Jogar Novamente</button>
        </div>
    </div>

</body>
</html>
