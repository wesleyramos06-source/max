<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Tycoon - Simulador de Vida Empresarial</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #172033;
            --text-color: #f8fafc;
            --green: #10b981;
            --red: #ef4444;
            --accent: #3b82f6;
            --gold: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .screen {
            width: 90%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .hidden {
            display: none !important;
        }

        /* Tela de Login */
        h2 {
            text-align: center;
            color: var(--accent);
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        /* Estilo BitLife */
        .profile-bar {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 15px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .profile-bar span strong {
            color: var(--accent);
        }

        .balance-box {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--green);
            text-align: center;
            margin: 20px 0;
        }

        .balance-box.negative {
            color: var(--red);
        }

        .log-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            height: 180px;
            overflow-y: auto;
            margin-bottom: 25px;
            font-size: 0.95rem;
            line-height: 1.5;
            border: 1px solid #1e293b;
        }

        .log-entry {
            margin-bottom: 10px;
            border-left: 3px solid var(--accent);
            padding-left: 8px;
        }

        .log-entry.success { border-left-color: var(--green); }
        .log-entry.fail { border-left-color: var(--red); }
        .log-entry.system { border-left-color: var(--gold); }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: var(--accent);
            color: white;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-age {
            background-color: var(--gold);
            color: #000;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .choice-btn {
            background-color: #1e293b;
            border: 1px solid #334155;
            text-align: left;
            font-weight: normal;
        }

        .choice-btn:hover {
            background-color: #273549;
            border-color: var(--accent);
        }
    </style>
</head>
<body>

    <div id="login-screen" class="screen">
        <h2>Criar Novo Empresário</h2>
        <div class="form-group">
            <label for="char-name">Nome do Personagem:</label>
            <input type="text" id="char-name" placeholder="Ex: Roberto Marinho" value="Carlos Almeira">
        </div>
        <div class="form-group">
            <label for="char-focus">Foco de Carreira Inicial:</label>
            <select id="char-focus">
                <option value="Tecnologia">Tecnologia (Apps e Startups)</option>
                <option value="Varejo">Varejo (Comércio e Franquias)</option>
                <option value="Finanças">Finanças (Ações e Ativos)</option>
            </select>
        </div>
        <button onclick="iniciarJogo()" style="width: 100%;">Começar Vida de Negócios ➔</button>
    </div>

    <div id="game-screen" class="screen hidden">
        <div class="profile-bar">
            <span>👤 <strong id="p-name">Nome</strong></span>
            <span>🎂 Idade: <strong id="p-age">18</strong> anos</span>
            <span>💼 Foco: <strong id="p-focus">Tech</strong></span>
        </div>

        <div class="balance-box" id="p-balance">R$ 0</div>

        <div class="log-box" id="game-log">
            </div>

        <div class="choices-container" id="choices-area">
            </div>

        <div class="choices-container">
            <button class="btn-age" onclick="envelhecer()">＋ Envelhecer 1 Ano</button>
        </div>
    </div>
