<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Carro</title>
  <style>
    canvas { background: #eee; display: block; margin: auto; }
    #ranking { text-align: center; font-family: Arial; margin-top: 10px; }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="400" height="600"></canvas>
  <div id="ranking"></div>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let carro = { x: 180, y: 500, largura: 40, altura: 80, cor: "blue" };
    let obstaculos = [];
    let pontuacao = 0;
    let fase = 1;
    let jogoAtivo = true;

    function desenharCarro() {
      ctx.fillStyle = carro.cor;
      ctx.fillRect(carro.x, carro.y, carro.largura, carro.altura);
    }

    function desenharObstaculos() {
      ctx.fillStyle = "red";
      obstaculos.forEach(o => ctx.fillRect(o.x, o.y, o.largura, o.altura));
    }

    function atualizarObstaculos() {
      obstaculos.forEach(o => o.y += 4 + fase);
      obstaculos = obstaculos.filter(o => o.y < canvas.height);
      if (Math.random() < 0.02) {
        obstaculos.push({ x: Math.random() * (canvas.width - 40), y: -50, largura: 40, altura: 40 });
      }
    }

    function detectarColisao() {
      return obstaculos.some(o =>
        carro.x < o.x + o.largura &&
        carro.x + carro.largura > o.x &&
        carro.y < o.y + o.altura &&
        carro.y + carro.altura > o.y
      );
    }

    function desenharPontuacao() {
      ctx.fillStyle = "black";
      ctx.font = "20px Arial";
      ctx.fillText(`Pontuação: ${pontuacao}`, 10, 20);
      ctx.fillText(`Fase: ${fase}`, 10, 40);
    }

    function salvarRanking(pontos) {
      let ranking = JSON.parse(localStorage.getItem("ranking")) || [];
      ranking.push(pontos);
      ranking.sort((a, b) => b - a);
      ranking = ranking.slice(0, 5); // top 5
      localStorage.setItem("ranking", JSON.stringify(ranking));
      mostrarRanking(ranking);
    }

    function mostrarRanking(ranking) {
      document.getElementById("ranking").innerHTML =
        "<h3>Ranking</h3>" + ranking.map((p, i) => `${i+1}º - ${p} pontos`).join("<br>");
    }

    function gameOver() {
      jogoAtivo = false;
      ctx.fillStyle = "black";
      ctx.font = "30px Arial";
      ctx.fillText("GAME OVER", 120, 300);
      salvarRanking(pontuacao);
    }

    function atualizar() {
      if (!jogoAtivo) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      desenharCarro();
      atualizarObstaculos();
      desenharObstaculos();
      if (detectarColisao()) { gameOver(); return; }
      desenharPontuacao();
      pontuacao++;
      if (pontuacao % 200 === 0) fase++;
      requestAnimationFrame(atualizar);
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft" && carro.x > 0) carro.x -= 20;
      if (e.key === "ArrowRight" && carro.x < canvas.width - carro.largura) carro.x += 20;
    });

    atualizar();
    mostrarRanking(JSON.parse(localStorage.getItem("ranking")) || []);
  </script>
</body>
</html>
