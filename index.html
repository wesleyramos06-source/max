<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Vida - Estilo BitLife</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #00e676;
            --button-bg: #292929;
            --button-hover: #3d3d3d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--button-bg);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            color: var(--accent-color);
            font-size: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
        }

        .stat-item {
            font-size: 14px;
        }

        .stat-item span {
            font-weight: bold;
            color: var(--accent-color);
        }

        .event-box {
            min-height: 120px;
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.5;
            border-left: 4px solid var(--accent-color);
            padding-left: 15px;
            display: flex;
            align-items: center;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid #444;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            text-align: left;
        }

        button:hover {
            background-color: var(--button-hover);
            border-color: var(--accent-color);
        }

        .btn-age {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
            width: 100%;
        }

        .btn-age:hover {
            background-color: #00b359;
        }

        .log-box {
            margin-top: 20px;
            max-height: 100px;
            overflow-y: auto;
            font-size: 12px;
            color: #aaa;
            border-top: 1px solid var(--button-bg);
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <header>
            <h1>Simulador de Vida</h1>
        </header>

        <div class="stats-grid">
            <div class="stat-item">Idade: <span id="stat-age">0 anos</span></div>
            <div class="stat-item">Saldo: <span id="stat-money">R$ 0</span></div>
            <div class="stat-item">Saúde: <span id="stat-health">100%</span></div>
            <div class="stat-item">Felicidade: <span id="stat-happiness">100%</span></div>
        </div>

        <div class="event-box" id="event-text">
            Você acabou de nascer! Seus pais te olham com amor. Clique em "+ Envelhecer" para começar sua jornada.
        </div>

        <div class="options-container" id="options-space">
            </div>

        <button class="btn-age" id="btn-advance" onclick="advanceYear()">+ Envelhecer 1 Ano</button>

        <div class="log-box" id="log-box">
            - Vida iniciada com R$ 0.
        </div>
    </div>

        const eventsDb = {

                    ]
                },
                {
                    text: "Você bateu o carro em um poste.",
                    choices: [
                        { text: "Pagar o conserto caro", money: -2000, health: 0, happiness: -15, log: "Prejuízo de R$ 2000 com o carro." },
                        { text: "Fugir a pé e fingir que foi roubado", money: 0, health: -10, happiness: -30, log: "A polícia desconfiou de você. Que estresse." }
                    ]
                }
            ],
            elderly: [
                {
                    text: "Suas costas estão doendo terrivelmente hoje.",
                    choices: [
                        { text: "Ir ao médico particular", money: -500, health: 20, happiness: 10, log: "Gastou R$ 500 no médico, mas melhorou." },
                        { text: "Tomar um chá caseiro e deitar", money: 0, health: -10, happiness: -5, log: "O chá não ajudou muito." }
                    ]
                },
                {
                    text: "Seus netos pediram dinheiro para comprar um doce.",
                    choices: [
                        { text: "Dar R$ 50 para cada", money: -100, health: 0, happiness: 40, log: "Você mimou seus netos com R$ 100." },
                        { text: "Dizer que no seu tempo as coisas eram de graça", money: 0, health: 0, happiness: -10, log: "Eles saíram resmungando." }
                    ]
                }
            ]
        };

        // Atualiza a interface gráfica do jogo
        function updateUI() {
            document.getElementById("stat-age").innerText = `${player.age} anos`;
            document.getElementById("stat-money").innerText = `R$ ${player.money}`;
            document.getElementById("stat-health").innerText = `${player.health}%`;
            document.getElementById("stat-happiness").innerText = `${player.happiness}%`;

            if (player.health <= 0) {
                gameOver("Você faleceu devido a problemas de saúde.");
            } else if (player.age >= 100) {
                gameOver("Você faleceu pacificamente de velhice aos 100 anos!");
            }
        }

        // Adiciona mensagens no painel de histórico
        function logMessage(text) {
            const logBox = document.getElementById("log-box");
            logBox.innerHTML = `- ${text}<br>` + logBox.innerHTML;
        }

        // Avança um ano na vida (Gera o loop de perguntas)
        function advanceYear() {
            if (!player.isAlive) return;

            player.age++;
            
            // Salário/Renda passiva básica automática dependendo da idade
            if (player.age >= 18 && player.age < 65) {
                player.money += 150; // Salário base por ser adulto
            } else if (player.age >= 65) {
                player.money += 100; // Aposentadoria base
            }

            // Seleciona a categoria de evento baseado na idade
            let category;
            if (player.age < 12) category = "childhood";
            else if (player.age < 18) category = "adolescence";
            else if (player.age < 65) category = "adult";
            else category = "elderly";

            // Sorteia um evento aleatório da categoria (Garantindo o Loop Infinito)
            const eventsList = eventsDb[category];
            const randomEvent = eventsList[Math.floor(Math.random() * eventsList.length)];

            // Renderiza o evento na tela
            displayEvent(randomEvent);
        }
